[package]
name = "presence3ds-helper"
version = "0.0.1"
edition = "2024"
authors = ["LeonLeBreton"]

[dependencies]
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
ctru-sys = { git = "https://github.com/rust3ds/ctru-rs" }
enum_dispatch = "0.3.13"
rqrr = { version = "0.11.0", default-features = false }
sha2 = "0.10"
ureq = "3.4.2"

[package.metadata.cargo-3ds]
romfs_dir = "romfs"
name = "Presence 3DS Helper"
description = "Presence 3DS Downloader and Configurator"
icon_path = "icon.png"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
